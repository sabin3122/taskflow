{% extends 'base.html' %}
{% load static %}

{% block title %}Create Todo{% endblock %}

{% block content %}
<div class="flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-yellow-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute top-0 right-0 w-96 h-96 bg-amber-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-96 h-96 bg-orange-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
    
    <div class="relative w-full max-w-md">
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-12 border border-white/20 hover:border-white/40 transition-all duration-300">
            <!-- Header -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-yellow-500 via-amber-500 to-orange-600 mb-6 shadow-2xl transform hover:scale-110 transition-transform duration-300 group">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </div>
                <h2 class="text-4xl font-bold bg-gradient-to-r from-white via-yellow-200 to-white bg-clip-text text-transparent">Create Todo</h2>
                <p class="text-gray-300 mt-3 text-lg">Add a new task to your list</p>
            </div>
            
            <!-- Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <!-- Title -->
                <div class="group">
                    <label class="block text-white text-sm font-bold mb-3" for="title">
                        Todo Title
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-yellow-400 group-focus-within:text-yellow-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                        </div>
                        <input 
                            class="w-full pl-12 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:bg-white/20 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500/50 transition-all duration-200 backdrop-blur-sm" 
                            id="title" 
                            type="text" 
                            name="title" 
                            placeholder="What needs to be done?"
                            required
                        >
                    </div>
                </div>
                
                <!-- Description -->
                <div class="group">
                    <label class="block text-white text-sm font-bold mb-3" for="description">
                        Description (Optional)
                    </label>
                    <textarea 
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:bg-white/20 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500/50 transition-all duration-200 backdrop-blur-sm" 
                        id="description" 
                        name="description" 
                        rows="4"
                        placeholder="Add more details about your task..."
                    ></textarea>
                </div>
                
                <!-- Submit Button -->
                <button 
                    class="w-full mt-8 bg-gradient-to-r from-yellow-500 via-amber-500 to-orange-600 hover:from-yellow-600 hover:via-amber-600 hover:to-orange-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-2xl transform hover:-translate-y-0.5 transition-all duration-200 text-lg"
                    type="submit"
                >
                    Create Todo
                </button>
            </form>
            
            <!-- Back Link -->
            <div class="mt-6 text-center">
                <a href="{% url 'todo_list' %}" class="text-gray-300 hover:text-yellow-300 text-sm transition-colors duration-200">
                    ← Back to Todo List
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes blob {
        0%, 100% {
            transform: translate(0, 0) scale(1);
        }
        33% {
            transform: translate(30px, -50px) scale(1.1);
        }
        66% {
            transform: translate(-20px, 20px) scale(0.9);
        }
    }
    
    .animate-blob {
        animation: blob 7s infinite;
    }
    
    .animation-delay-2000 {
        animation-delay: 2s;
    }
    
    .animation-delay-4000 {
        animation-delay: 4s;
    }
</style>
{% endblock %}
