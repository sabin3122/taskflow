{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Todo{% endblock %}

{% block content %}
<div class="flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-red-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute top-0 right-0 w-96 h-96 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-96 h-96 bg-rose-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
    
    <div class="relative w-full max-w-md">
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-12 border border-white/20 hover:border-white/40 transition-all duration-300">
            <!-- Header -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500 via-pink-500 to-rose-600 mb-6 shadow-2xl transform hover:scale-110 transition-transform duration-300 group">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                </div>
                <h2 class="text-4xl font-bold bg-gradient-to-r from-white via-red-200 to-white bg-clip-text text-transparent">Delete Todo?</h2>
                <p class="text-gray-300 mt-3 text-lg">This action cannot be undone</p>
            </div>
            
            <!-- Todo Info -->
            <div class="bg-white/10 rounded-2xl p-6 mb-8 border border-white/20">
                <p class="text-gray-300 text-sm mb-2">You are about to delete:</p>
                <p class="text-white text-lg font-bold break-words">{{ todo.title }}</p>
                {% if todo.description %}
                <p class="text-gray-400 text-sm mt-3">{{ todo.description }}</p>
                {% endif %}
            </div>
            
            <!-- Buttons -->
            <form method="POST" class="space-y-3">
                {% csrf_token %}
                
                <button 
                    class="w-full bg-gradient-to-r from-red-600 via-pink-600 to-rose-600 hover:from-red-700 hover:via-pink-700 hover:to-rose-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-2xl transform hover:-translate-y-0.5 transition-all duration-200"
                    type="submit"
                >
                    Delete Todo
                </button>
                
                <a href="{% url 'todo_list' %}" class="block text-center w-full bg-white/10 border border-white/20 hover:bg-white/20 text-white font-bold py-3 px-4 rounded-xl transition-all duration-200">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

<style>
    @keyframes blob {
        0%, 100% {
            transform: translate(0, 0) scale(1);
        }
        33% {
            transform: translate(30px, -50px) scale(1.1);
        }
        66% {
            transform: translate(-20px, 20px) scale(0.9);
        }
    }
    
    .animate-blob {
        animation: blob 7s infinite;
    }
    
    .animation-delay-2000 {
        animation-delay: 2s;
    }
    
    .animation-delay-4000 {
        animation-delay: 4s;
    }
</style>
{% endblock %}
